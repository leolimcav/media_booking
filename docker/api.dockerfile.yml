FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
WORKDIR /app

COPY *.sln .
COPY Media.Api/*.csproj ./Media.Api_build/
COPY Media.Api/Directory.Packages.props ./Media.Api_build/
RUN dotnet restore Media.Api_build/Media.Api.csproj

COPY Media.Api/. ./Media.Api_build/
WORKDIR /app/Media.Api_build
RUN dotnet publish -c Release -o /app --no-restore

FROM mcr.microsoft.com/dotnet/aspnet:8.0
WORKDIR /app
COPY --from=build /app ./
COPY ./ssl/cert.pem ./cert.pem
COPY ./ssl/key.pem ./key.pem

ENTRYPOINT ["dotnet", "Media.Api.dll", "--urls", "https://*:443", "--Kestrel:Certificates:Default:Path", "/app/cert.pem", "--Kestrel:Certificates:Default:KeyPath", "/app/key.pem"]
