services:
  media_db:
    image: postgres:latest
    container_name: media_db
    environment:
      - POSTGRES_PASSWORD=admin
      - POSTGRES_USER=admin
      - POSTGRES_DB=mediadb
    networks:
      - media_network
    volumes:
      - media_volume:/var/lib/postgresql/data

  media_api:
    container_name: media_api
    image: leolimcav/media-api:1.0
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - media_network
    depends_on:
      - media_db

  media_front:
    container_name: media_front
    image: leolimcav/media-front:1.0
    ports:
      - "80:80"
      - "443:443"
    networks:
      - media_network
    depends_on:
      - media_api

networks:
  media_network:
    driver: bridge

volumes:
  media_volume:
